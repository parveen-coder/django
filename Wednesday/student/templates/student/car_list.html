<h2>Car Records</h2>

<a href="{% url 'car_create' %}">Add New Car</a>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Car Details</th>
        <th>Actions</th>
    </tr>

    {% for car in cars %}
    <tr>
        <td>{{ car.id }}</td>
        <td>{{ car }}</td>

        <td>
            <a href="{% url 'car_detail' car.id %}">
                View Details
            </a>
            
            |

            <a href="{% url 'car_update' car.id %}">
                Edit
            </a>

            |

            <a href="{% url 'car_delete' car.id %}">
                Delete
            </a>
        </td>
    </tr>

    {% empty %}
    <tr>
        <td colspan="3">No cars available.</td>
    </tr>
    {% endfor %}
</table>
